<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking font load: the WebView paints immediately with the
         system font, then swaps to Plus Jakarta / Space Grotesk once the
         stylesheet arrives. Critical for Capacitor cold start, where a
         render-blocking <link rel="stylesheet"> to fonts.googleapis.com
         can stall first paint by several seconds on flaky mobile data. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Trace — Time Tracking for Freelancers</title>
    <meta name="description" content="Timer-first time tracking for freelancers. Start instantly, organize later.">
    <meta name="author" content="Lovable" />

    <!-- Installable web app (Add to Home Screen) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f5f4f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trace" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-512.png" />



    <meta property="og:title" content="Trace — Time Tracking for Freelancers">
    <meta property="og:description" content="Timer-first time tracking for freelancers. Start instantly, organize later.">
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://trace-timetrackingapp.lovable.app/og-preview.png">
    <meta property="og:url" content="https://trace.lla-studio.com">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trace — Time Tracking for Freelancers">
    <meta name="twitter:description" content="Timer-first time tracking for freelancers. Start instantly, organize later.">
    <meta name="twitter:image" content="https://trace-timetrackingapp.lovable.app/og-preview.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Trace",
      "description": "Timer-first time tracking for freelancers. Start instantly, organize later.",
      "url": "https://trace.lla-studio.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "publisher": { "@type": "Organization", "name": "LLA Studio", "url": "https://lla-studio.com" }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Trace",
      "url": "https://trace.lla-studio.com"
    }
    </script>


    <!-- Microsoft Clarity — deferred until after first paint, and skipped
         entirely inside the Capacitor native shell so it never competes
         with app startup on Android cold launch. -->
    <script type="text/javascript">
      (function () {
        var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (isNative) return;
        var load = function () {
          (function(c,l,a,r,i,t,y){
              c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
              t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
              y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", "x0x8uieq5h");
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(load, { timeout: 4000 });
        } else {
          setTimeout(load, 2500);
        }
      })();
    </script>
</head>

  <body>
    <!-- Inline boot skeleton: rendered by the WebView the moment the HTML
         arrives, before main.tsx parses or React mounts. Critical for
         Capacitor Android cold start — without this, users stare at a blank
         background for 1-3s while the JS bundle parses. Removed from
         src/main.tsx after React's first paint. -->
    <style>
      #boot-skeleton {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f5f4f1;
        color: #3a3142;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        transition: opacity 200ms ease;
      }
      #boot-skeleton .boot-mark {
        font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
        margin-bottom: 24px; opacity: 0.85;
      }
      #boot-skeleton .boot-spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2.5px solid rgba(122, 63, 134, 0.18);
        border-top-color: #7a3f86;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #boot-skeleton { background: #14101a; color: #f0eaf2; }
        #boot-skeleton .boot-spinner { border-color: rgba(240, 234, 242, 0.18); border-top-color: #f0eaf2; }
      }
    </style>
    <div id="root">
      <div id="boot-skeleton" aria-hidden="true">
        <div class="boot-mark">Trace</div>
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
