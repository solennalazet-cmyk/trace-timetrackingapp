<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking font load: the WebView paints immediately with the
         system font, then swaps to Plus Jakarta / Space Grotesk once the
         stylesheet arrives. Critical for Capacitor cold start, where a
         render-blocking <link rel="stylesheet"> to fonts.googleapis.com
         can stall first paint by several seconds on flaky mobile data. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"></noscript>
